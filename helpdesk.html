<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="description" content="Form for booking a CWA Help Desk appointment" />
  <meta name="keywords" content="HTML, Form, Help Desk, CWA, appointment" />
  <meta name="author" content="Ali Musaid" />
  <title>CWA Help Desk Appointment</title>
</head>
<body>
  <p><a href="http://www.swin.edu.au"><img src="lab03/images/logo.png" alt="Swinburne University of Technology logo" width="200" height="100" /></a></p>

  <h1>CWA Help Desk Appointment</h1>

  <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
  <p>Check Blackboard for when CWA tutors will be there.</p>

  <form method="post" action="http://mercury.swin.edu.au/it000000/formtest.php">

    <fieldset>
      <legend>Student details</legend>
      <p>
        <label for="studentid">Student ID</label>
        <input type="text" name="studentid" id="studentid" required="required"
               pattern="\d{7,10}" title="Enter between 7 and 10 digits" />
      </p>
      <p>
        <label for="givenname">Given Name</label>
        <input type="text" name="givenname" id="givenname" maxlength="15" size="15" required="required"
               pattern="[A-Za-z]+" title="Alphabetical characters only" />
        <label for="familyname">Family Name</label>
        <input type="text" name="familyname" id="familyname" maxlength="15" size="15" required="required"
               pattern="[A-Za-z]+" title="Alphabetical characters only" />
      </p>
    </fieldset>

    <fieldset>
      <legend>Your unit</legend>
      <p>
        <input type="radio" id="cos10011" name="unit" value="COS10011" required="required" />
        <label for="cos10011">COS10011</label>
        <input type="radio" id="cos60004" name="unit" value="COS60004" />
        <label for="cos60004">COS60004</label>
        <input type="radio" id="cos60007" name="unit" value="COS60007" />
        <label for="cos60007">COS60007</label>
      </p>
      <p>
        <label for="tutor">Your Tutor</label>
        <select name="tutor" id="tutor" required="required">
          <option value="">Please Select</option>
          <option value="alice">Alice Nguyen</option>
          <option value="bob">Bob Smith</option>
          <option value="chen">Chen Wei</option>
          <option value="dana">Dana Patel</option>
        </select>
      </p>
    </fieldset>

    <fieldset>
      <legend>Issue</legend>
      <p>
        <label for="html">HTML</label>
        <input type="checkbox" id="html" name="issue[]" value="html" checked="checked" />
        <label for="css">CSS</label>
        <input type="checkbox" id="css" name="issue[]" value="css" />
        <label for="js">JavaScript</label>
        <input type="checkbox" id="js" name="issue[]" value="javascript" />
        <label for="php">PHP</label>
        <input type="checkbox" id="php" name="issue[]" value="php" />
        <label for="mysql">MySQL</label>
        <input type="checkbox" id="mysql" name="issue[]" value="mysql" />
      </p>
      <p>
        <label for="description">Description of Issue</label><br />
        <textarea id="description" name="description" rows="5" cols="40"
                  placeholder="Write description of your problem here..."></textarea>
      </p>
    </fieldset>

    <fieldset>
      <legend>Preferred Date / Time</legend>
      <p>
        <label for="date">Date</label>
        <input type="text" name="date" id="date" placeholder="dd/mm/yyyy" size="10" maxlength="10"
               pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}" title="Use the format dd/mm/yyyy" />
      </p>
      <p>
        <label for="time">Time</label>
        <input type="text" name="time" id="time" placeholder="00:00" size="5" maxlength="5"
               pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" title="Use the 24-hour format hh:mm" />
      </p>
    </fieldset>

    <input type="submit" value="Book" />
    <input type="reset" value="Reset form" />
  </form>
</body>
</html>
